services:
  nginx-lb:
    image: nginx:stable-alpine
    container_name: nginx-lb-rag
    ports:
      - "${LB_PORT:-8082}:80"
    env_file:
      - .env.production
    volumes:
      - ./docker/nginx/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
