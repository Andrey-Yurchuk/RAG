services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    container_name: rag-app-green
    ports:
      - "${GREEN_PORT:-8081}:80"
      - "${GREEN_HTTPS_PORT:-8441}:443"
    env_file:
      - .env.production
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./storage:/app/storage
      - ./public:/app/public
      - ./bin:/app/bin
      - ./database:/app/database
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./phpstan.neon:/app/phpstan.neon
      - ./phpcs.xml:/app/phpcs.xml
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./.env:/app/.env
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - CADDY_GLOBAL_OPTIONS=${APP_DEBUG:-false}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - VECTOR_SEARCH_THRESHOLD=${VECTOR_SEARCH_THRESHOLD}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - CHUNK_SIZE=${CHUNK_SIZE}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_TASK_CACHE_PREFIX=${REDIS_TASK_CACHE_PREFIX}
      - HYBRID_SEARCH_VECTOR_TOP_K=${HYBRID_SEARCH_VECTOR_TOP_K}
      - HYBRID_SEARCH_KEYWORD_TOP_K=${HYBRID_SEARCH_KEYWORD_TOP_K}
      - HYBRID_SEARCH_RRF_K=${HYBRID_SEARCH_RRF_K}
    depends_on:
      - redis
      - rabbitmq
      - llm-service
    networks:
      - rag-network-green
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # External PostgreSQL database - shared between Blue and Green environments
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: rag-postgres-green
  #   ports:
  #     - "${DB_EXTERNAL_PORT:-5434}:5432"
  #   env_file:
  #     - .env.production
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE}
  #     POSTGRES_USER: ${DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres_data_green:/var/lib/postgresql/data
  #     - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   networks:
  #     - rag-network-green
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #       reservations:
  #         memory: 256M

  redis:
    image: redis:7-alpine
    container_name: rag-redis-green
    env_file:
      - .env.production
    volumes:
      - redis_data_green:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    networks:
      - rag-network-green
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rag-rabbitmq-green
    env_file:
      - .env.production
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
      - "${RABBITMQ_AMQP_PORT:-5673}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data_green:/var/lib/rabbitmq
    networks:
      - rag-network-green
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  llm-service:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: rag-llm-green
    env_file:
      - .env.production
    volumes:
      - /var/www/html/models:/models
    command: >
      -m "/models/qwen2.5-7b-instruct-q4_k_m.gguf"
      --host 0.0.0.0
      --port 8080
      -c "${LLM_CONTEXT_SIZE:-4096}"
      -np "${LLM_CPU_CORES:-2}"
    restart: unless-stopped
    networks:
      - rag-network-green

  rag-worker:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    container_name: rag-worker-green
    env_file:
      - .env.production
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./storage:/app/storage
      - ./bin:/app/bin
      - ./database:/app/database
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_TASK_CACHE_PREFIX=${REDIS_TASK_CACHE_PREFIX}
      - VECTOR_SEARCH_THRESHOLD=${VECTOR_SEARCH_THRESHOLD}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - CHUNK_SIZE=${CHUNK_SIZE}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT}
      - HYBRID_SEARCH_VECTOR_TOP_K=${HYBRID_SEARCH_VECTOR_TOP_K}
      - HYBRID_SEARCH_KEYWORD_TOP_K=${HYBRID_SEARCH_KEYWORD_TOP_K}
      - HYBRID_SEARCH_RRF_K=${HYBRID_SEARCH_RRF_K}
    depends_on:
      - redis
      - rabbitmq
      - llm-service
    networks:
      - rag-network-green
    restart: unless-stopped
    command: php bin/rag-worker.php
    healthcheck:
      test: ["CMD", "true"]
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  redis_data_green:
  rabbitmq_data_green:

networks:
  rag-network-green:
    driver: bridge
