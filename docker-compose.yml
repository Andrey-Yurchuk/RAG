services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    container_name: rag-app
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./storage:/app/storage
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - CADDY_GLOBAL_OPTIONS=${APP_DEBUG:-false}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - VECTOR_SEARCH_THRESHOLD=${VECTOR_SEARCH_THRESHOLD}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - CHUNK_SIZE=${CHUNK_SIZE}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT}
    depends_on:
      - postgres
      - redis
      - llm-service
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
  llm-service:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: rag-llm
    volumes:
      - ./models:/models
    environment:
      - MODEL=${LLM_MODEL_PATH}
    command: >
      -m ${LLM_MODEL_PATH}
      --host 0.0.0.0
      --port 8080
      -c 2048
      -np 1
    restart: unless-stopped
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
volumes:
  postgres_data:
  redis_data:
networks:
  rag-network:
    driver: bridge 