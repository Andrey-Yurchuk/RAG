services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    container_name: rag-app
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./storage:/app/storage
      - ./public:/app/public
      - ./bin:/app/bin
      - ./database:/app/database
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      - ./phpstan.neon:/app/phpstan.neon
      - ./phpcs.xml:/app/phpcs.xml
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
      - CADDY_GLOBAL_OPTIONS=${APP_DEBUG:-false}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - VECTOR_SEARCH_THRESHOLD=${VECTOR_SEARCH_THRESHOLD}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - CHUNK_SIZE=${CHUNK_SIZE}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_TASK_CACHE_PREFIX=${REDIS_TASK_CACHE_PREFIX}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - llm-service
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rag-rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
  llm-service:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: rag-llm
    volumes:
      - ./models:/models
    environment:
      - MODEL=${LLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-q4_k_m.gguf}
    command: >
      -m ${LLM_MODEL_PATH:-/models/qwen2.5-7b-instruct-q4_k_m.gguf}
      --host 0.0.0.0
      --port 8080
      -c ${LLM_CONTEXT_SIZE:-4096}
      -np ${LLM_CPU_CORES:-2}
    restart: unless-stopped
    networks:
      - rag-network

  rag-worker:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    container_name: rag-worker
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./storage:/app/storage
      - ./bin:/app/bin
      - ./database:/app/database
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_TASK_CACHE_PREFIX=${REDIS_TASK_CACHE_PREFIX}
      - VECTOR_SEARCH_THRESHOLD=${VECTOR_SEARCH_THRESHOLD}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - CHUNK_SIZE=${CHUNK_SIZE}
      - VECTOR_SEARCH_LIMIT=${VECTOR_SEARCH_LIMIT}
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - llm-service
    networks:
      - rag-network
    restart: unless-stopped
    command: >
      sh -c "
        php bin/rag-worker.php
      "
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
networks:
  rag-network:
    driver: bridge 