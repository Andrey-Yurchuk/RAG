name: Deploy RAG System to Production

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Update code and deploy
        run: |
          echo "Starting Blue-Green deployment..."
          cd /var/www/html/rag-system
          ./scripts/blue-green-deploy.sh update_code_from_git
          ./scripts/blue-green-deploy.sh
          
      - name: Cleanup old images
        run: |
          echo "Cleaning up old Docker images..."
          docker image prune -f
          
      - name: Deployment successful
        run: |
          echo "Blue-Green deployment completed successfully!"
          echo "Application is running at: http://212.67.14.54:8082"
